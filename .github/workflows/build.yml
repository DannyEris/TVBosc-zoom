name: Build TVBox APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '版本与架构选择 (Version & Architecture)'
        required: true
        default: 'java32 (Java 32位 - armeabi-v7a)'
        type: choice
        options:
          - 'java32 (Java 32位 - armeabi-v7a)'
          - 'java64 (Java 64位 - arm64-v8a)'
          - 'java (Java 双架构 - universal)'
          - 'python32 (Python 32位 - armeabi-v7a)'
          - 'python64 (Python 64位 - arm64-v8a)'
          - 'python (Python 双架构 - universal)'
          - 'all (全部版本 - 编译所有架构与模式)'
      build_type:
        description: '编译类型 (Build Type)'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
      include_source:
        description: '是否打包源码 (Package Source Code Archive)'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Generate local.properties
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_PATH" > local.properties
          echo "Generated local.properties content:"
          cat local.properties

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine Gradle Task
        id: gradle_task
        run: |
          # 1. 提取选项开头的标识符
          RAW_FLAVOR="${{ github.event.inputs.flavor }}"
          FLAVOR=$(echo "$RAW_FLAVOR" | awk '{print $1}')
          
          # 2. 转换编译类型首字母大写
          TYPE="${{ github.event.inputs.build_type }}"
          TYPE_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${TYPE:0:1})${TYPE:1}"
          
          # 3. 映射对应的 Gradle Task
          if [ "$FLAVOR" = "all" ]; then
            TASK="assemble${TYPE_CAP}"
          else
            FLAVOR_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${FLAVOR:0:1})${FLAVOR:1}"
            TASK="assemble${FLAVOR_CAP}${TYPE_CAP}"
          fi
          
          echo "Selected Flavor: $FLAVOR"
          echo "Selected Gradle Task: $TASK"
          echo "task=$TASK" >> $GITHUB_OUTPUT
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT

      - name: Build APK with Gradle
        run: ./gradlew ${{ steps.gradle_task.outputs.task }} --stacktrace

      - name: Sign and Align APKs
        run: |
          # 1. 动态生成独立签名证书
          keytool -genkey -v -keystore tvbox.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias tvbox -keypass 123456 -storepass 123456 \
            -dname "CN=TVBox, OU=TVBox, O=TVBox, L=SH, ST=SH, C=CN"

          # 2. 定位云端 Build Tools
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "Using Build Tools from: $BUILD_TOOLS_DIR"

          # 3. 对生成的 APK 进行对齐与签名
          find app/build/outputs/apk -name "*.apk" | while read -r apk; do
            echo "----------------------------------------"
            echo "Processing APK: $apk"
            
            aligned_apk="${apk%.apk}-aligned.apk"
            signed_apk="${apk%.apk}-signed.apk"
            
            # 对齐优化
            "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$apk" "$aligned_apk" 2>/dev/null || cp "$apk" "$aligned_apk"
            
            # apksigner V1 + V2 + V3 签名
            "$BUILD_TOOLS_DIR/apksigner" sign --ks tvbox.jks --ks-pass pass:123456 --key-pass pass:123456 --ks-key-alias tvbox --out "$signed_apk" "$aligned_apk"
            rm -f "$aligned_apk"
            
            # 去除文件名中的 -unsigned 标识并替换原文件
            final_apk="${apk/-unsigned/}"
            mv -f "$signed_apk" "$final_apk"
            if [ "$final_apk" != "$apk" ]; then
              rm -f "$apk"
            fi
            
            # 校验签名状态
            echo "Verifying signature for $final_apk:"
            "$BUILD_TOOLS_DIR/apksigner" verify -v "$final_apk"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-${{ steps.gradle_task.outputs.flavor }}-${{ github.event.inputs.build_type }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Archive Source Code
        if: ${{ github.event.inputs.include_source == 'true' || github.event.inputs.include_source == true }}
        run: |
          mkdir -p output_source
          # 使用 git archive 导出当前分支/提交的纯净源码，避免打包编译产生的中间文件和敏感签名
          git archive --format=zip HEAD -o output_source/TVBox-source-${{ steps.gradle_task.outputs.flavor }}-${{ github.sha }}.zip

      - name: Upload Source Code Artifact
        if: ${{ github.event.inputs.include_source == 'true' || github.event.inputs.include_source == true }}
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-source-${{ steps.gradle_task.outputs.flavor }}
          path: output_source/*.zip
          if-no-files-found: error
